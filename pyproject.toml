[project]
name = "document-classification-agent"
version = "0.1.0"
description = "KI-gestütztes Assistenzsystem zur Dokumentenklassifizierung"
readme = "README.md"
requires-python = ">=3.12.10"
dependencies = [
    "docling>=2.145.0",
    "fastapi>=0.162.0",
    "langchain>=1.4.7",
    "psycopg2>=2.9.13",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.2",
    "pydantic[email]>=2.14.2",
    "sqlalchemy>=2.1.6",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]

[tool.uv]
package = false
